# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Test
  displayName: Test
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        containerRegistry: 'FachIT 360 - Docker Registry'
        repository: 'network/fit360-netcup-ddns-client'
        command: 'build'
        Dockerfile: './NetCup_DynDNS_Client/Dockerfile'
        buildContext: '.'
        tags: '$(tag)'
    - task: SonarCloudPrepare@3
      inputs:
        SonarQube: 'SonarQube'
        organization: 'fachit360'
        scannerMode: 'dotnet'
        projectKey: 'FachIT360_NetCup-DynDns-Client'
        projectName: 'NetCup-DynDns-Client'