# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    displayName: 'Install .Net SDK 9.0'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore projects in Sulution'
    inputs:
      command: 'restore'
      projects: '*.sln'

  - task: SonarCloudPrepare@3
    displayName: SonarQube Prepare
    inputs:
      SonarQube: 'SonarQube'
      organization: 'fachit360'
      scannerMode: 'dotnet'
      projectKey: 'FachIT360_NetCup-DynDns-Client'
      projectName: 'NetCup-DynDns-Client'

  - task: DotNetCoreCLI@2
    displayName: 'Build all projects in solution'
    inputs:
      command: build
      projects: '*.sln'

  - task: DotNetCoreCLI@2
    displayName: 'Execute Tests'
    inputs:
      command: test
      projects: '**/*Tests.csproj'
      arguments: '--collect "Code Coverage"'

  - task: SonarCloudAnalyze@3
    inputs:
      jdkversion: 'JAVA_HOME'

  - task: SonarCloudPublish@3
    inputs:
      pollingTimeoutSec: '300'